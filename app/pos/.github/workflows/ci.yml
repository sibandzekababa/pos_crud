name: FastAPI POS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python runtime environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # 👈 Caching option removed to stop the missing requirements file error

    - name: Install framework requirements and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest httpx sqlalchemy fastapi pydantic passlib[bcrypt] python-jose[cryptography] python-multipart PyJWT "pwdlib[argon2]"
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f app/pos/requirements.txt ]; then pip install -r app/pos/requirements.txt; fi

    - name: Execute automated unit test suite with path mapping
      run: |
        PYTHONPATH=. python3 -m pytest -v
